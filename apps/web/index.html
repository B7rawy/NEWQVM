<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>QParts</title>
    <script>
      // Apply theme before first paint (no flash). Read the shared cookie first so the choice
      // carries across workspace subdomains; fall back to localStorage. Default is LIGHT.
      try {
        var m = document.cookie.match(/(?:^|; )qvm_theme=([^;]*)/);
        var t = (m && decodeURIComponent(m[1])) || localStorage.getItem("qvm_theme");
        if (t === "dark") document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
